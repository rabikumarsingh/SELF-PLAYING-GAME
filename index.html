<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Playing Snake Game - 1 Hour Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            font-size: 2rem;
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            color: #fff;
            font-size: 1.1rem;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .info-label {
            color: #00ff88;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            background: #0a0a1a;
        }

        .status {
            margin-top: 15px;
            color: #fff;
            font-size: 1.2rem;
        }

        .game-over {
            color: #ff4757;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-radius: 5px;
            transition: width 1s linear;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .info-panel { flex-direction: column; gap: 10px; }
            #gameCanvas { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Self-Playing Snake</h1>
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Score:</span> <span id="score">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Time Left:</span> <span id="timeLeft">60:00</span>
            </div>
            <div class="info-item">
                <span class="info-label">High Score:</span> <span id="highScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 100%"></div>
        </div>
        <div class="status" id="status">Game Running...</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const timeLeftElement = document.getElementById('timeLeft');
        const highScoreElement = document.getElementById('highScore');
        const statusElement = document.getElementById('status');
        const progressFill = document.getElementById('progressFill');

        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const gameDuration = 60 * 60 * 1000; // 1 hour in milliseconds

        // Game state
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = 0;
        let gameRunning = true;
        let startTime = Date.now();
        let gameSpeed = 100; // milliseconds per frame

        // Initialize game
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            placeFood();
            updateScore();
        }

        // Place food randomly
        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (isOnSnake(food.x, food.y));
        }

        // Check if position is on snake
        function isOnSnake(x, y) {
            return snake.some(segment => segment.x === x && segment.y === y);
        }

        // AI Logic - Self-playing algorithm
        function getAIDirection() {
            const head = snake[0];
            const possibleMoves = [
                { x: 0, y: -1 }, // Up
                { x: 0, y: 1 },  // Down
                { x: -1, y: 0 }, // Left
                { x: 1, y: 0 }   // Right
            ];

            // Filter out moves that would kill the snake
            const safeMoves = possibleMoves.filter(move => {
                // Can't reverse direction
                if (move.x === -direction.x && move.y === -direction.y) return false;

                const newX = head.x + move.x;
                const newY = head.y + move.y;

                // Check boundaries
                if (newX < 0 || newX >= tileCount || newY < 0 || newY >= tileCount) return false;

                // Check collision with snake (excluding tail which will move)
                for (let i = 0; i < snake.length - 1; i++) {
                    if (snake[i].x === newX && snake[i].y === newY) return false;
                }

                return true;
            });

            if (safeMoves.length === 0) return direction;

            // Prioritize moves that get closer to food
            safeMoves.sort((a, b) => {
                const distA = Math.abs(head.x + a.x - food.x) + Math.abs(head.y + a.y - food.y);
                const distB = Math.abs(head.x + b.x - food.x) + Math.abs(head.y + b.y - food.y);
                return distA - distB;
            });

            // Use flood fill to check if move leads to trapped area
            for (const move of safeMoves) {
                if (canReachMostTiles(head.x + move.x, head.y + move.y)) {
                    return move;
                }
            }

            return safeMoves[0];
        }

        // Flood fill to check accessibility
        function canReachMostTiles(startX, startY) {
            const visited = new Set();
            const queue = [{ x: startX, y: startY }];
            visited.add(`${startX},${startY}`);

            while (queue.length > 0) {
                const current = queue.shift();
                const neighbors = [
                    { x: current.x + 1, y: current.y },
                    { x: current.x - 1, y: current.y },
                    { x: current.x, y: current.y + 1 },
                    { x: current.x, y: current.y - 1 }
                ];

                for (const neighbor of neighbors) {
                    const key = `${neighbor.x},${neighbor.y}`;
                    if (
                        neighbor.x >= 0 && neighbor.x < tileCount &&
                        neighbor.y >= 0 && neighbor.y < tileCount &&
                        !visited.has(key) &&
                        !isOnSnake(neighbor.x, neighbor.y)
                    ) {
                        visited.add(key);
                        queue.push(neighbor);
                    }
                }
            }

            // Need to reach at least 50% of available tiles
            return visited.size >= (tileCount * tileCount - snake.length) * 0.5;
        }

        // Update game state
        function update() {
            if (!gameRunning) return;

            // Get AI direction
            nextDirection = getAIDirection();
            direction = nextDirection;

            // Calculate new head position
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check collisions
            if (
                head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount ||
                isOnSnake(head.x, head.y)
            ) {
                gameOver();
                return;
            }

            // Move snake
            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                if (score > highScore) highScore = score;
                placeFood();
                updateScore();
                
                // Speed up slightly every 50 points
                if (score % 50 === 0 && gameSpeed > 50) {
                    gameSpeed -= 5;
                }
            } else {
                snake.pop();
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    0,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2
                );
                
                if (index === 0) {
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00cc6a');
                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(0, 200, 100, ${alpha})`);
                    gradient.addColorStop(1, `rgba(0, 150, 75, ${alpha})`);
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2,
                    5
                );
                ctx.fill();

                // Draw eyes on head
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (direction.x === 1) {
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + 6, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.x === -1) {
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + 6, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.y === -1) {
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + 6, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - 6, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + 6, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - 6, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // Draw food
            const foodGradient = ctx.createRadialGradient(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                0,
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2
            );
            foodGradient.addColorStop(0, '#ff6b6b');
            foodGradient.addColorStop(1, '#ee5a5a');

            ctx.fillStyle = foodGradient;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Food glow effect
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Update score display
        function updateScore() {
            scoreElement.textContent = score;
            highScoreElement.textContent = highScore;
        }

        // Update timer
        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, gameDuration - elapsed);
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            
            timeLeftElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const progress = (remaining / gameDuration) * 100;
            progressFill.style.width = `${progress}%`;

            if (remaining <= 0) {
                endGame();
            }
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            statusElement.textContent = '💀 Game Over! Restarting...';
            statusElement.classList.add('game-over');
            
            setTimeout(() => {
                initGame();
                gameRunning = true;
                statusElement.textContent = 'Game Running...';
                statusElement.classList.remove('game-over');
            }, 2000);
        }

        // End game (time expired)
        function endGame() {
            gameRunning = false;
            statusElement.textContent = '🏆 Time\'s Up! Final Score: ' + score;
            statusElement.classList.add('game-over');
        }

        // Game loop
        let lastUpdate = 0;
        function gameLoop(timestamp) {
            if (timestamp - lastUpdate >= gameSpeed) {
                update();
                draw();
                lastUpdate = timestamp;
            }
            
            updateTimer();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
